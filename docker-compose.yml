version: '3.8'

services:
  the27club-server:
    container_name: 27club_ctf
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      ctf_net:
        ipv4_address: 192.168.56.10 # O mapeo automático al host

networks:
  ctf_net:
    driver: bridge

